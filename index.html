<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Mobile Site</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <header>
    <div class="logo">My Mobile Site</div>
    <ul class="nav-links">
      <li><a href="#click">Click</a></li>
      <li><a href="#toggle">Toggle</a></li>
      <li><a href="#form">Form</a></li>
    </ul>
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <main>

    <!-- Click Section -->
    <section id="click">
      <h2>1️⃣ Button Click (jQuery)</h2>
      <button id="clickBtn">Click Me</button>
      <div id="messageBox"></div>
    </section>

    <!-- Toggle Section -->
    <section id="toggle">
      <h2>2️⃣ Toggle Info Section</h2>
      <button id="toggleBtn">Show/Hide Info</button>
      <div id="infoBox">📘 This is a toggleable message using jQuery!</div>
    </section>

    <!-- Form Section -->
    <section id="form">
      <h2>3️⃣ Form Validation</h2>
      <input type="text" id="nameInput" placeholder="Enter your name" />
      <button id="submitBtn">Submit</button>
      <div id="formResult"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
